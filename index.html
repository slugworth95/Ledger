<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger — portable notes</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22262B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --paper:#E9E9E3;
  --wash:#DEDED6;
  --rule:#C8C9C0;
  --ink:#191A17;
  --graphite:#5A5C56;
  --slate:#22262B;
  --stamp:#8C2F39;
  --stamp-soft:rgba(140,47,57,.10);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
html[data-theme="dark"]{
  --paper:#16181B;
  --wash:#1E2126;
  --rule:#2E333A;
  --ink:#DEDFD9;
  --graphite:#878B85;
  --slate:#0F1113;
  --stamp:#C4545F;
  --stamp-soft:rgba(196,84,95,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);
  overscroll-behavior:none;
  display:flex;flex-direction:column;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}

/* ---------- top bar ---------- */
.bar{
  background:var(--slate);color:#E9E9E3;
  display:flex;align-items:center;gap:2px;
  padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;
  flex:0 0 auto;
}
html[data-theme="dark"] .bar{border-bottom:1px solid var(--rule)}
.brand{
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  padding:0 10px 0 6px;opacity:.8;white-space:nowrap;
}
.brand b{color:var(--stamp);font-weight:700}
.bar .spacer{flex:1}
.ibtn{
  width:38px;height:38px;border-radius:7px;display:grid;place-items:center;
  color:#E9E9E3;opacity:.85;position:relative;
}
.ibtn:hover{background:rgba(255,255,255,.08);opacity:1}
.ibtn.on{opacity:1}
.ibtn.on::after{
  content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;
  border-radius:50%;background:#4CAF50;box-shadow:0 0 0 2px var(--slate);
}
.ibtn svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------- layout ---------- */
.wrap{flex:1;display:flex;min-height:0;position:relative}

/* index pane */
.index{
  width:290px;flex:0 0 auto;border-right:1px solid var(--rule);
  display:flex;flex-direction:column;background:var(--wash);min-height:0;
}
.search{
  padding:10px;border-bottom:1px solid var(--rule);display:flex;gap:8px;align-items:center;
}
.search input{
  width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:6px;
  padding:8px 10px;font-family:var(--mono);font-size:13px;color:var(--ink);
}
.search input::placeholder{color:var(--graphite)}
.list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.row{
  display:block;width:100%;text-align:left;padding:11px 14px;
  border-bottom:1px solid var(--rule);position:relative;
}
.row:hover{background:var(--paper)}
.row.on{background:var(--paper)}
.row.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stamp)}
.row .t{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-family:var(--mono);font-size:10.5px;color:var(--graphite);letter-spacing:.03em;
  display:flex;gap:8px}
.row .m .dot{opacity:.45}
.empty{padding:28px 18px;color:var(--graphite);font-size:13px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}

.newbtn{
  border-top:1px solid var(--rule);padding:12px;font-family:var(--mono);font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;
  justify-content:center;gap:8px;background:var(--paper);
}
.newbtn:hover{background:var(--stamp-soft);color:var(--stamp)}

/* editor pane */
.editor{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.meta{
  display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:11px;color:var(--graphite);letter-spacing:.05em;
  flex:0 0 auto;
}
.meta .sep{opacity:.4}
.meta .grow{flex:1}
.meta .act{color:var(--stamp);text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;
  padding:5px 9px;border:1px solid var(--stamp);border-radius:5px}
.meta .act:hover{background:var(--stamp);color:var(--paper)}
.meta .plain{padding:5px 7px;border-radius:5px}
.meta .plain:hover{background:var(--wash);color:var(--ink)}
.meta .plain[aria-pressed="true"]{background:var(--stamp-soft);color:var(--stamp)}
.toolbar{
  display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--rule);
  flex:0 0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.tbtn{
  min-width:30px;height:30px;padding:0 8px;border-radius:6px;display:grid;place-items:center;
  font-family:var(--mono);font-size:13px;color:var(--graphite);flex:0 0 auto;
}
.tbtn:hover{background:var(--wash);color:var(--ink)}
.tsep{width:1px;height:18px;background:var(--rule);margin:0 4px;flex:0 0 auto}
textarea{
  flex:1;width:100%;border:none;resize:none;background:var(--paper);color:var(--ink);
  font-family:var(--mono);font-size:15px;line-height:1.68;padding:20px 18px 40vh;
  outline:none;min-height:0;
}
.preview{
  flex:1;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  font-size:15px;line-height:1.68;padding:20px 18px 40vh;
}
.preview h1,.preview h2,.preview h3,.preview h4,.preview h5,.preview h6{margin:1.2em 0 .5em;line-height:1.3}
.preview h1{font-size:1.6em}.preview h2{font-size:1.35em}.preview h3{font-size:1.15em}
.preview p{margin:0 0 1em}
.preview code{font-family:var(--mono);background:var(--wash);padding:.15em .4em;border-radius:4px;font-size:.9em}
.preview pre{background:var(--wash);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:0 0 1em}
.preview pre code{background:none;padding:0}
.preview blockquote{margin:0 0 1em;padding:2px 0 2px 14px;border-left:3px solid var(--stamp);color:var(--graphite)}
.preview ul,.preview ol{margin:0 0 1em;padding-left:1.4em}
.preview li{margin:.25em 0}
.preview li.task{list-style:none;margin-left:-1.4em}
.preview li.task input{margin-right:.5em}
.preview hr{border:none;border-top:1px solid var(--rule);margin:1.5em 0}
.preview a{color:var(--stamp)}
.noselect{display:grid;place-items:center;flex:1;padding:30px;text-align:center;color:var(--graphite)}
.noselect p{font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;line-height:1.9;max-width:280px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,11,10,.5);opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:50;background:var(--paper);border:1px solid var(--rule);
  left:50%;top:50%;transform:translate(-50%,-48%);width:min(440px,calc(100% - 28px));
  border-radius:10px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-height:86vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);
}
.sheet.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.sheet h2{
  margin:0;padding:15px 18px;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:600;display:flex;align-items:center;gap:9px;
}
.sheet h2 .sq{width:9px;height:9px;background:var(--stamp)}
.sheet .body{padding:6px 0}
.opt{
  display:flex;width:100%;text-align:left;gap:13px;padding:13px 18px;align-items:flex-start;
  border-bottom:1px solid var(--rule);
}
.opt:last-child{border-bottom:none}
.opt:hover{background:var(--wash)}
.opt .ext{
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;font-weight:700;
  background:var(--stamp-soft);color:var(--stamp);padding:4px 6px;border-radius:4px;
  flex:0 0 auto;margin-top:1px;min-width:46px;text-align:center;
}
.opt .txt strong{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.opt .txt span{font-size:12.5px;color:var(--graphite);line-height:1.45;display:block}
.opt.danger .ext{background:transparent;border:1px solid var(--rule);color:var(--graphite)}
.sheet .foot{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:10px}
.sheet .foot button{
  flex:1;padding:10px;border:1px solid var(--rule);border-radius:6px;font-family:var(--mono);
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
}
.sheet .foot button:hover{background:var(--wash)}
.sheet .foot .go{background:var(--stamp);color:#fff;border-color:var(--stamp)}
.sheet .foot .go:hover{opacity:.88;background:var(--stamp)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);
  transform:translate(-50%,14px);background:var(--slate);color:#E9E9E3;
  font-family:var(--mono);font-size:12px;letter-spacing:.04em;padding:11px 16px;border-radius:7px;
  opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* drag */
.drop{
  position:fixed;inset:0;z-index:70;background:rgba(140,47,57,.14);
  border:3px dashed var(--stamp);display:none;place-items:center;
  font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--stamp)
}
.drop.on{display:grid}

/* mobile */
.backbtn{display:none}
@media (max-width:720px){
  .index{
    position:absolute;inset:0;width:100%;z-index:20;border-right:none;
    transform:translateX(-100%);transition:transform .22s ease;
  }
  body.browsing .index{transform:translateX(0)}
  .backbtn{display:grid}
  .row{padding:14px}
  textarea{font-size:16px;padding:16px 15px 45vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="browsing">

<div class="bar">
  <button class="ibtn backbtn" id="back" aria-label="All notes" title="All notes">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="brand">Ledger<b>.</b></div>
  <div class="spacer"></div>
  <button class="ibtn" id="imp" aria-label="Import file" title="Import">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 16V4M7 9l5-5 5 5M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2"/></svg>
  </button>
  <button class="ibtn" id="exp" aria-label="Export" title="Export">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v12M7 11l5 5 5-5M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2"/></svg>
  </button>
  <button class="ibtn" id="drive" aria-label="Connect Google Drive" title="Connect Google Drive">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 18a4 4 0 01-.6-7.96 5 5 0 019.44-2A4.5 4.5 0 0117.5 17H7z"/><path d="M12 12v5M9.5 14.5L12 12l2.5 2.5"/></svg>
  </button>
  <button class="ibtn" id="theme" aria-label="Switch theme" title="Theme">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a9 9 0 109 9 7 7 0 01-9-9z"/></svg>
  </button>
</div>

<div class="wrap">
  <nav class="index" id="index" aria-label="Notes list">
    <div class="search">
      <input id="q" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off" spellcheck="false">
    </div>
    <div class="list" id="list"></div>
    <button class="newbtn" id="new">＋ New note</button>
  </nav>

  <main class="editor">
    <div class="meta" id="meta" hidden>
      <span id="mDate">—</span>
      <span class="sep">/</span>
      <span id="mSize">0 B</span>
      <span class="grow"></span>
      <button class="plain" id="preview" aria-pressed="false" title="Toggle preview">Preview</button>
      <button class="plain" id="dup" title="Duplicate">Copy</button>
      <button class="plain" id="del" title="Delete">Delete</button>
      <button class="act" id="ship">Export</button>
    </div>
    <div class="toolbar" id="toolbar" hidden role="toolbar" aria-label="Formatting">
      <button class="tbtn" data-cmd="bold" aria-label="Bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="tbtn" data-cmd="italic" aria-label="Italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="tbtn" data-cmd="strike" aria-label="Strikethrough" title="Strikethrough (Ctrl+Shift+X)"><s>S</s></button>
      <span class="tsep" aria-hidden="true"></span>
      <button class="tbtn" data-cmd="check" aria-label="Checklist" title="Checklist">[x]</button>
      <button class="tbtn" data-cmd="ul" aria-label="Bulleted list" title="Bulleted list">•</button>
      <button class="tbtn" data-cmd="ol" aria-label="Numbered list" title="Numbered list">1.</button>
      <button class="tbtn" data-cmd="quote" aria-label="Quote" title="Quote">&gt;</button>
      <button class="tbtn" data-cmd="code" aria-label="Inline code" title="Inline code">`</button>
    </div>
    <textarea id="ed" aria-label="Note text" placeholder="Start typing.

The first line becomes the title." spellcheck="true" hidden></textarea>
    <div class="preview" id="previewPane" hidden></div>
    <div class="noselect" id="blank">
      <p>No note open.<br>Pick one from the index, or start a new one.</p>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet1" role="dialog" aria-modal="true" aria-labelledby="s1h">
  <h2 id="s1h"><span class="sq"></span> Export this note</h2>
  <div class="body">
    <button class="opt" data-a="one-html"><span class="ext">.html</span><span class="txt"><strong>Readable web page</strong><span>Opens in any browser, works offline, and Ledger can re-import it later. The recommended way to move a note around.</span></span></button>
    <button class="opt" data-a="one-md"><span class="ext">.md</span><span class="txt"><strong>Markdown</strong><span>Plain text for Obsidian, git, or anything else.</span></span></button>
    <button class="opt" data-a="one-txt"><span class="ext">.txt</span><span class="txt"><strong>Plain text</strong><span>No formatting, nothing to interpret.</span></span></button>
    <button class="opt" data-a="one-share" id="shareOpt" hidden><span class="ext">send</span><span class="txt"><strong>Share the web page</strong><span>Hand the .html file straight to another app.</span></span></button>
    <button class="opt" data-a="one-drive"><span class="ext">drive</span><span class="txt"><strong>Save a copy to Drive</strong><span>Uploads this note as its own file to your connected Google Drive.</span></span></button>
  </div>
</div>

<div class="sheet" id="sheet2" role="dialog" aria-modal="true" aria-labelledby="s2h">
  <h2 id="s2h"><span class="sq"></span> Export everything</h2>
  <div class="body">
    <button class="opt" data-a="all-html"><span class="ext">.html</span><span class="txt"><strong>Whole notebook as one page</strong><span>Every note in a single file with its own search. Readable anywhere, and re-importable.</span></span></button>
    <button class="opt" data-a="all-json"><span class="ext">.json</span><span class="txt"><strong>Backup file</strong><span>Exact data, for restoring into Ledger.</span></span></button>
    <button class="opt" data-a="all-md"><span class="ext">.md</span><span class="txt"><strong>Markdown bundle</strong><span>All notes in one Markdown document.</span></span></button>
    <button class="opt" data-a="all-drive"><span class="ext">drive</span><span class="txt"><strong>Save notebook to Drive</strong><span>Uploads the whole notebook as one file to your connected Google Drive.</span></span></button>
  </div>
</div>

<div class="sheet" id="sheet3" role="dialog" aria-modal="true" aria-labelledby="s3h">
  <h2 id="s3h"><span class="sq"></span> Import a note</h2>
  <div class="body" id="driveFileList">
    <button class="opt" data-a="imp-device"><span class="ext">file</span><span class="txt"><strong>From this device</strong><span>Pick a file from your computer or phone.</span></span></button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="drop" id="drop">Drop to import</div>
<input type="file" id="file" accept=".html,.htm,.json,.md,.txt,.markdown,text/*" multiple hidden>

<script>
/* ============ storage adapter ============
   Uses the artifact storage API when present, falls back to
   localStorage when this file is hosted on your own server. */
const KEY = "ledger:notes:v1";
const Store = (() => {
  const ws = (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") ? window.storage : null;
  return {
    kind: ws ? "artifact" : "local",
    async load(){
      if (ws){
        try { const r = await ws.get(KEY); return r && r.value ? JSON.parse(r.value) : []; }
        catch(e){ return []; }
      }
      try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : []; }
      catch(e){ return []; }
    },
    async save(notes){
      const v = JSON.stringify(notes);
      if (ws){ try { await ws.set(KEY, v); return true; } catch(e){ return false; } }
      try { localStorage.setItem(KEY, v); return true; } catch(e){ return false; }
    }
  };
})();

/* ============ state ============ */
let notes = [];
let current = null;
let saveTimer = null;
const $ = s => document.querySelector(s);
const el = {
  list:$("#list"), ed:$("#ed"), meta:$("#meta"), blank:$("#blank"),
  mDate:$("#mDate"), mSize:$("#mSize"), q:$("#q"), toast:$("#toast"),
  scrim:$("#scrim"), s1:$("#sheet1"), s2:$("#sheet2"), s3:$("#sheet3"), drop:$("#drop"), file:$("#file"),
  toolbar:$("#toolbar"), preview:$("#preview"), previewPane:$("#previewPane"), drive:$("#drive")
};
let previewOn = false;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const titleOf = t => {
  const l = (t||"").split("\n").find(x => x.trim());
  if (!l) return "Untitled";
  return l.replace(/^#{1,6}\s*/,"").trim().slice(0,90) || "Untitled";
};
const bytes = n => {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(1) + " KB";
  return (n/1048576).toFixed(2) + " MB";
};
const size = t => new Blob([t||""]).size;
const when = ts => {
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  const y = new Date(now); y.setDate(y.getDate()-1);
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  const opts = d.getFullYear() === now.getFullYear() ? {month:"short",day:"numeric"} : {year:"numeric",month:"short",day:"numeric"};
  return d.toLocaleDateString([], opts);
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => (titleOf(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "note").slice(0,48);

function toast(msg){
  el.toast.textContent = msg;
  el.toast.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.toast.classList.remove("on"), 2300);
}

/* ============ tiny markdown ============ */
function md(src, opts){
  opts = opts || {};
  const lines = String(src||"").replace(/\r\n/g,"\n").split("\n");
  let out = [], i = 0, para = [], list = null;
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" rel="noreferrer">$1</a>')
    .replace(/(^|[\s(])((?:https?:\/\/)[^\s<)]+)/g, '$1<a href="$2" rel="noreferrer">$2</a>');
  const flushP = () => { if (para.length){ out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const flushL = () => { if (list){ out.push("</" + list + ">"); list = null; } };
  const openL = t => { if (list !== t){ flushL(); out.push("<" + t + ">"); list = t; } };

  while (i < lines.length){
    const ln = lines[i];
    if (/^```/.test(ln)){
      flushP(); flushL();
      const lang = ln.slice(3).trim(); const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push('<pre data-lang="' + esc(lang) + '"><code>' + esc(buf.join("\n")) + "</code></pre>");
      continue;
    }
    if (!ln.trim()){ flushP(); flushL(); i++; continue; }
    let m;
    if (m = ln.match(/^(#{1,6})\s+(.*)$/)){
      flushP(); flushL();
      const lv = m[1].length;
      out.push("<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">");
    } else if (/^(-{3,}|\*{3,}|_{3,})$/.test(ln.trim())){
      flushP(); flushL(); out.push("<hr>");
    } else if (m = ln.match(/^\s*[-*+]\s+\[([ xX])\]\s+(.*)$/)){
      flushP(); openL("ul");
      const boxAttr = opts.interactive ? ' data-ln="' + i + '"' : " disabled";
      out.push('<li class="task"><input type="checkbox"' + boxAttr + (m[1]===" "?"":" checked") + "> " + inline(m[2]) + "</li>");
    } else if (m = ln.match(/^\s*[-*+]\s+(.*)$/)){
      flushP(); openL("ul"); out.push("<li>" + inline(m[1]) + "</li>");
    } else if (m = ln.match(/^\s*\d+[.)]\s+(.*)$/)){
      flushP(); openL("ol"); out.push("<li>" + inline(m[1]) + "</li>");
    } else if (m = ln.match(/^>\s?(.*)$/)){
      flushP(); flushL(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>");
    } else {
      flushL(); para.push(ln.trim());
    }
    i++;
  }
  flushP(); flushL();
  return out.join("\n");
}

/* ============ render ============ */
function render(){
  const term = el.q.value.trim().toLowerCase();
  const shown = notes
    .filter(n => !term || (n.text||"").toLowerCase().includes(term))
    .sort((a,b) => b.updated - a.updated);

  if (!shown.length){
    el.list.innerHTML = term
      ? '<div class="empty"><b>Nothing matched.</b>Try a different word, or clear the search.</div>'
      : '<div class="empty"><b>No notes yet.</b>Start one below, or import a file you exported earlier — Ledger reads back its own .html and .json.</div>';
  } else {
    el.list.innerHTML = shown.map(n => {
      const body = (n.text||"").split("\n").slice(1).join(" ").trim();
      return '<button class="row' + (current === n.id ? " on" : "") + '" data-id="' + n.id + '"' +
        (current === n.id ? ' aria-current="true"' : '') + '>' +
        '<div class="t">' + esc(titleOf(n.text)) + "</div>" +
        '<div class="m"><span>' + when(n.updated) + '</span><span class="dot">·</span><span>' +
        bytes(size(n.text)) + "</span></div></button>";
    }).join("");
  }

  const n = notes.find(x => x.id === current);
  if (n){
    el.meta.hidden = false; el.blank.hidden = true;
    if (el.ed.value !== n.text) el.ed.value = n.text;
    el.mDate.textContent = when(n.updated);
    el.mSize.textContent = bytes(size(n.text));
    el.preview.setAttribute("aria-pressed", previewOn ? "true" : "false");
    el.preview.textContent = previewOn ? "Edit" : "Preview";
    el.toolbar.hidden = previewOn;
    el.ed.hidden = previewOn;
    el.previewPane.hidden = !previewOn;
    if (previewOn) el.previewPane.innerHTML = md(n.text, {interactive:true}) || '<p style="color:var(--graphite)">Nothing to preview yet.</p>';
  } else {
    el.meta.hidden = true; el.toolbar.hidden = true; el.ed.hidden = true;
    el.previewPane.hidden = true; el.blank.hidden = false;
  }
}

/* ============ formatting ============ */
function edReplace(start, end, text, selStart, selEnd){
  el.ed.value = el.ed.value.slice(0, start) + text + el.ed.value.slice(end);
  el.ed.focus();
  el.ed.selectionStart = selStart; el.ed.selectionEnd = selEnd;
  el.ed.dispatchEvent(new Event("input"));
}

function toggleWrap(before, after){
  after = after === undefined ? before : after;
  const s = el.ed.selectionStart, e = el.ed.selectionEnd, v = el.ed.value;
  const sel = v.slice(s, e);
  const pre = v.slice(Math.max(0, s - before.length), s);
  const post = v.slice(e, e + after.length);
  if (before && pre === before && post === after){
    edReplace(s - before.length, e + after.length, sel, s - before.length, e - before.length);
  } else {
    edReplace(s, e, before + sel + after, s + before.length, s + before.length + sel.length);
  }
}

function forEachSelectedLine(fn){
  const v = el.ed.value;
  const s = el.ed.selectionStart, e = el.ed.selectionEnd;
  const start = v.lastIndexOf("\n", s - 1) + 1;
  let end = v.indexOf("\n", Math.max(e - 1, start));
  if (end === -1) end = v.length;
  const out = v.slice(start, end).split("\n").map(fn).join("\n");
  edReplace(start, end, out, start, start + out.length);
}

const LINE_MARKERS = {
  check: {re: /^(\s*)[-*+]\s+\[[ xX]\]\s+/, add: ind => ind + "- [ ] "},
  ul:    {re: /^(\s*)[-*+]\s+(?!\[[ xX]\])/, add: ind => ind + "- "},
  ol:    {re: /^(\s*)\d+[.)]\s+/, add: ind => ind + "1. "},
  quote: {re: /^(\s*)>\s?/, add: ind => ind + "> "}
};
function toggleLineMarker(kind){
  const {re, add} = LINE_MARKERS[kind];
  forEachSelectedLine(line => {
    if (!line.trim()) return line;
    const indent = (line.match(/^(\s*)/) || ["",""])[1];
    if (re.test(line)) return line.replace(re, indent);
    let stripped = line;
    for (const k in LINE_MARKERS) stripped = stripped.replace(LINE_MARKERS[k].re, indent);
    return add(indent) + stripped.slice(indent.length);
  });
}

/* ============ google drive ============
   Uses the drive.file scope, which only ever grants access to files
   this app itself created — never the rest of the user's Drive. */
const GOOGLE_CLIENT_ID = "678128922768-msabi6gv91lp4q5dpmk1819711c7khhh.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
let tokenClient = null;
let driveToken = null;
let driveFileId = null;
let driveFolderId = null;
let driveSyncTimer = null;
try { driveFileId = localStorage.getItem("ledger:driveFileId") || null; } catch(e){}
try { driveFolderId = localStorage.getItem("ledger:driveFolderId") || null; } catch(e){}

function updateDriveUI(connected){
  el.drive.classList.toggle("on", connected);
  const label = connected ? "Google Drive connected — click to disconnect" : "Connect Google Drive";
  el.drive.setAttribute("aria-label", label);
  el.drive.title = label;
}

function initGoogle(){
  if (tokenClient) return true;
  if (!window.google || !google.accounts || !google.accounts.oauth2) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: () => {}
  });
  return true;
}

function trySilentDriveReconnect(attempts){
  attempts = attempts || 0;
  if (attempts > 15) return;
  if (initGoogle()) ensureDrive();
  else setTimeout(() => trySilentDriveReconnect(attempts + 1), 300);
}

function ensureDrive(interactive){
  return new Promise(resolve => {
    if (driveToken){ resolve(true); return; }
    if (!initGoogle()){ if (interactive) toast("Google Sign-In isn't available here"); resolve(false); return; }
    let settled = false;
    const done = ok => { if (settled) return; settled = true; clearTimeout(timer); resolve(ok); };
    const timer = setTimeout(() => {
      if (interactive) toast("Couldn't reach Google — check your popup blocker");
      done(false);
    }, 25000);
    tokenClient.callback = resp => {
      if (resp.error){ done(false); return; }
      driveToken = { access_token: resp.access_token, expires_at: Date.now() + resp.expires_in * 1000 };
      try { localStorage.setItem("ledger:driveConnected", "1"); } catch(e){}
      updateDriveUI(true);
      done(true);
    };
    tokenClient.requestAccessToken({ prompt: interactive ? "consent" : "" });
  });
}

async function driveFetch(url, opts){
  opts = opts || {};
  const withAuth = () => Object.assign({}, opts, {
    headers: Object.assign({}, opts.headers, { Authorization: "Bearer " + (driveToken ? driveToken.access_token : "") })
  });
  let res = await fetch(url, withAuth());
  if (res.status === 401){
    driveToken = null;
    const ok = await ensureDrive(false);
    res = ok ? await fetch(url, withAuth()) : res;
  }
  return res;
}

function multipartBody(meta, mime, text){
  const boundary = "ledgerbound" + Date.now();
  return {
    boundary,
    body: "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(meta) +
      "\r\n--" + boundary + "\r\nContent-Type: " + mime + "\r\n\r\n" + text +
      "\r\n--" + boundary + "--"
  };
}

async function ensureDriveFolder(){
  if (driveFolderId) return driveFolderId;
  try {
    const res = await driveFetch("https://www.googleapis.com/drive/v3/files", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name: "Ledger", mimeType: "application/vnd.google-apps.folder"})
    });
    if (!res.ok) throw new Error("folder create failed");
    const data = await res.json();
    driveFolderId = data.id;
    try { localStorage.setItem("ledger:driveFolderId", driveFolderId); } catch(e){}
    return driveFolderId;
  } catch(e){
    return null;
  }
}

async function listDriveFiles(){
  const folderId = await ensureDriveFolder();
  if (!folderId) return [];
  try {
    const q = encodeURIComponent("'" + folderId + "' in parents and trashed = false");
    const fields = encodeURIComponent("files(id,name,modifiedTime)");
    const res = await driveFetch("https://www.googleapis.com/drive/v3/files?q=" + q + "&fields=" + fields + "&orderBy=modifiedTime desc");
    if (!res.ok) return [];
    const data = await res.json();
    return data.files || [];
  } catch(e){
    return [];
  }
}

async function uploadToDrive(name, text, mime){
  const ok = await ensureDrive(true);
  if (!ok) return false;
  try {
    const folderId = await ensureDriveFolder();
    const meta = {name, mimeType: mime};
    if (folderId) meta.parents = [folderId];
    const {boundary, body} = multipartBody(meta, mime, text);
    const res = await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method: "POST",
      headers: {"Content-Type": "multipart/related; boundary=" + boundary},
      body
    });
    if (!res.ok) throw new Error("upload failed");
    toast("Saved " + name + " to Drive");
    return true;
  } catch(e){
    toast("Couldn't save to Drive");
    return false;
  }
}

function queueDriveSync(){
  if (!driveToken) return;
  clearTimeout(driveSyncTimer);
  driveSyncTimer = setTimeout(driveSyncNow, 2500);
}

async function driveSyncNow(){
  if (!driveToken) return;
  const body = JSON.stringify({kind:"ledger", version:1, exported:Date.now(), notes}, null, 2);
  try {
    let res;
    if (driveFileId){
      res = await driveFetch("https://www.googleapis.com/upload/drive/v3/files/" + driveFileId + "?uploadType=media", {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body
      });
      if (!res.ok) throw new Error("update failed");
    } else {
      const folderId = await ensureDriveFolder();
      const meta = {name: "ledger-backup.json", mimeType: "application/json"};
      if (folderId) meta.parents = [folderId];
      const {boundary, body: mpBody} = multipartBody(meta, "application/json", body);
      res = await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
        method: "POST",
        headers: {"Content-Type": "multipart/related; boundary=" + boundary},
        body: mpBody
      });
      if (!res.ok) throw new Error("create failed");
      const data = await res.json();
      driveFileId = data.id;
      try { localStorage.setItem("ledger:driveFileId", driveFileId); } catch(e){}
    }
  } catch(e){
    toast("Drive sync failed — will retry");
  }
}

async function persist(){ await Store.save(notes); queueDriveSync(); }
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 350);
}

function setCurrent(id){
  current = id;
  try {
    if (id) localStorage.setItem("ledger:current", id);
    else localStorage.removeItem("ledger:current");
  } catch(e){}
}

function openNote(id){
  setCurrent(id);
  previewOn = false;
  document.body.classList.remove("browsing");
  render();
  if (window.innerWidth > 720) el.ed.focus();
}

function newNote(text){
  const n = {id:uid(), text:text||"", created:Date.now(), updated:Date.now()};
  notes.push(n); setCurrent(n.id);
  previewOn = false;
  document.body.classList.remove("browsing");
  persist(); render();
  return n;
}

/* ============ file out ============ */
function download(name, text, mime){
  const blob = new Blob([text], {type: mime + ";charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Saved " + name);
}

async function shareFile(name, text, mime){
  try{
    const file = new File([text], name, {type: mime});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:name});
      return true;
    }
  }catch(e){ if (e && e.name === "AbortError") return true; }
  return false;
}

/* ============ file in ============ */
function readPayload(html){
  const m = html.match(/<script type="application\/json" id="ledger-data">([\s\S]*?)<\/script>/);
  if (!m) return null;
  try{
    const data = JSON.parse(m[1].replace(/<\\\//g, "</"));
    return (data && Array.isArray(data.notes)) ? data.notes : null;
  }catch(e){ return null; }
}

function stripHTML(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("script,style,noscript").forEach(x => x.remove());
  return (doc.body ? doc.body.innerText || doc.body.textContent : "").replace(/\n{3,}/g,"\n\n").trim();
}

function parseIncoming(name, raw){
  name = name.toLowerCase();
  let incoming = null;
  if (name.endsWith(".json")){
    try{
      const d = JSON.parse(raw);
      incoming = Array.isArray(d) ? d : (Array.isArray(d.notes) ? d.notes : null);
    }catch(e){ incoming = null; }
  } else if (name.endsWith(".html") || name.endsWith(".htm") || /^\s*<!doctype html/i.test(raw)){
    incoming = readPayload(raw);
    if (!incoming){
      const t = stripHTML(raw);
      incoming = t ? [{text:t}] : null;
    }
  } else {
    incoming = raw.trim() ? [{text: raw}] : null;
  }
  return incoming;
}

async function addIncomingNotes(lists){
  let added = 0, skipped = 0;
  for (const incoming of lists){
    if (!incoming || !incoming.length){ skipped++; continue; }
    for (const n of incoming){
      const text = typeof n === "string" ? n : (n.text || n.body || n.content || "");
      if (!text.trim()) continue;
      if (notes.some(x => x.text === text)) continue;   // don't duplicate
      notes.push({
        id: uid(),
        text,
        created: n.created || Date.now(),
        updated: n.updated || Date.now()
      });
      added++;
    }
  }
  await persist(); render();
  if (added) toast("Imported " + added + " note" + (added===1?"":"s"));
  else toast(skipped ? "Nothing readable in that file" : "Nothing new to import");
}

async function importFiles(files){
  const lists = [];
  for (const f of files){
    let raw;
    try { raw = await f.text(); } catch(e){ lists.push(null); continue; }
    lists.push(parseIncoming(f.name, raw));
  }
  await addIncomingNotes(lists);
}

async function importFromDrive(fileId, name){
  try{
    const res = await driveFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media");
    if (!res.ok) throw new Error("fetch failed");
    const raw = await res.text();
    await addIncomingNotes([parseIncoming(name, raw)]);
  }catch(e){
    toast("Couldn't import from Drive");
  }
}

/* ============ sheets ============ */
let openSheet = null;
let sheetTrigger = null;
function showSheet(s){
  sheetTrigger = document.activeElement;
  openSheet = s; s.classList.add("on"); el.scrim.classList.add("on");
  const first = s.querySelector(".opt");
  if (first) first.focus();
}
function hideSheet(){
  if (openSheet) openSheet.classList.remove("on");
  openSheet = null; el.scrim.classList.remove("on");
  if (sheetTrigger){ sheetTrigger.focus(); sheetTrigger = null; }
}

document.addEventListener("click", async e => {
  const opt = e.target.closest(".opt");
  if (!opt) return;
  const a = opt.dataset.a;
  const n = notes.find(x => x.id === current);
  hideSheet();
  if (a.startsWith("one-") && !n) return;

  if (a === "one-html")  download(slug(n.text) + ".html", noteHTML(n), "text/html");
  if (a === "one-md")    download(slug(n.text) + ".md", noteMD(n), "text/markdown");
  if (a === "one-txt")   download(slug(n.text) + ".txt", n.text || "", "text/plain");
  if (a === "one-share"){
    const name = slug(n.text) + ".html";
    const ok = await shareFile(name, noteHTML(n), "text/html");
    if (!ok) download(name, noteHTML(n), "text/html");
  }
  if (a === "one-drive") await uploadToDrive(slug(n.text) + ".html", noteHTML(n), "text/html");
  const stamp = new Date().toISOString().slice(0,10);
  if (a === "all-html")  download("notebook-" + stamp + ".html", bookHTML(notes), "text/html");
  if (a === "all-json")  download("ledger-backup-" + stamp + ".json",
      JSON.stringify({kind:"ledger", version:1, exported:Date.now(), notes}, null, 2), "application/json");
  if (a === "all-md")    download("notebook-" + stamp + ".md", bookMD(notes), "text/markdown");
  if (a === "all-drive") await uploadToDrive("notebook-" + stamp + ".html", bookHTML(notes), "text/html");
  if (a === "imp-device") el.file.click();
  if (a === "imp-drive")  await importFromDrive(opt.dataset.id, opt.dataset.name);
});

/* ============ wiring ============ */
el.list.addEventListener("click", e => {
  const r = e.target.closest(".row");
  if (r) openNote(r.dataset.id);
});
el.q.addEventListener("input", render);

$("#new").addEventListener("click", () => { newNote(); el.ed.focus(); });
$("#back").addEventListener("click", () => document.body.classList.add("browsing"));

el.ed.addEventListener("input", () => {
  const n = notes.find(x => x.id === current);
  if (!n) return;
  n.text = el.ed.value; n.updated = Date.now();
  el.mSize.textContent = bytes(size(n.text));
  el.mDate.textContent = when(n.updated);
  const row = el.list.querySelector('.row[data-id="' + n.id + '"] .t');
  if (row) row.textContent = titleOf(n.text);
  queueSave();
});

$("#del").addEventListener("click", async () => {
  const n = notes.find(x => x.id === current);
  if (!n) return;
  if (!confirm("Delete “" + titleOf(n.text) + "”? This can't be undone.")) return;
  notes = notes.filter(x => x.id !== current);
  setCurrent(null);
  await persist(); render();
  if (window.innerWidth <= 720) document.body.classList.add("browsing");
  toast("Note deleted");
});

$("#dup").addEventListener("click", () => {
  const n = notes.find(x => x.id === current);
  if (!n) return;
  newNote(n.text); render(); toast("Copy made");
});

el.preview.addEventListener("click", () => {
  if (!current) return;
  previewOn = !previewOn;
  render();
});

el.toolbar.addEventListener("click", e => {
  const b = e.target.closest(".tbtn");
  if (!b) return;
  const cmd = b.dataset.cmd;
  if (cmd === "bold") toggleWrap("**");
  else if (cmd === "italic") toggleWrap("*");
  else if (cmd === "strike") toggleWrap("~~");
  else if (cmd === "code") toggleWrap("`");
  else if (cmd === "check") toggleLineMarker("check");
  else if (cmd === "ul") toggleLineMarker("ul");
  else if (cmd === "ol") toggleLineMarker("ol");
  else if (cmd === "quote") toggleLineMarker("quote");
});

el.previewPane.addEventListener("click", e => {
  const cb = e.target.closest('input[type="checkbox"][data-ln]');
  if (!cb) return;
  const n = notes.find(x => x.id === current);
  if (!n) return;
  const lines = n.text.replace(/\r\n/g,"\n").split("\n");
  const idx = +cb.dataset.ln;
  if (lines[idx] === undefined) return;
  lines[idx] = lines[idx].replace(/\[[ xX]\]/, cb.checked ? "[x]" : "[ ]");
  n.text = lines.join("\n"); n.updated = Date.now();
  const row = el.list.querySelector('.row[data-id="' + n.id + '"] .t');
  if (row) row.textContent = titleOf(n.text);
  queueSave(); render();
});

$("#ship").addEventListener("click", () => showSheet(el.s1));
$("#exp").addEventListener("click", () => {
  if (!notes.length) return toast("No notes to export yet");
  showSheet(el.s2);
});
$("#imp").addEventListener("click", async () => {
  if (!driveToken){ el.file.click(); return; }
  const list = document.getElementById("driveFileList");
  list.innerHTML = '<div class="empty"><b>Loading Drive files…</b></div>';
  showSheet(el.s3);
  const files = await listDriveFiles();
  list.innerHTML =
    '<button class="opt" data-a="imp-device"><span class="ext">file</span><span class="txt"><strong>From this device</strong><span>Pick a file from your computer or phone.</span></span></button>' +
    files.map(f => '<button class="opt" data-a="imp-drive" data-id="' + f.id + '" data-name="' + esc(f.name) + '"><span class="ext">drive</span><span class="txt"><strong>' + esc(f.name) + '</strong><span>' + when(new Date(f.modifiedTime).getTime()) + '</span></span></button>').join("");
  const firstOpt = list.querySelector(".opt");
  if (firstOpt && openSheet === el.s3) firstOpt.focus();
});
el.file.addEventListener("change", e => {
  if (e.target.files.length) importFiles([...e.target.files]);
  e.target.value = "";
});
el.scrim.addEventListener("click", hideSheet);

$("#theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("ledger:theme", next); } catch(e){}
});

el.drive.addEventListener("click", async () => {
  if (driveToken){
    if (window.google && google.accounts && google.accounts.oauth2){
      google.accounts.oauth2.revoke(driveToken.access_token, () => {});
    }
    driveToken = null;
    try { localStorage.removeItem("ledger:driveConnected"); } catch(e){}
    updateDriveUI(false);
    toast("Google Drive disconnected");
    return;
  }
  const ok = await ensureDrive(true);
  if (ok){ toast("Google Drive connected"); queueDriveSync(); }
});

/* drag and drop */
let dragDepth = 0;
["dragenter","dragover"].forEach(t => window.addEventListener(t, e => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes("Files")) return;
  e.preventDefault();
  if (t === "dragenter") dragDepth++;
  el.drop.classList.add("on");
}));
window.addEventListener("dragleave", () => { if (--dragDepth <= 0){ dragDepth = 0; el.drop.classList.remove("on"); } });
window.addEventListener("drop", e => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault(); dragDepth = 0; el.drop.classList.remove("on");
  importFiles([...e.dataTransfer.files]);
});

/* keys */
window.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === "Escape"){ if (openSheet) hideSheet(); else el.q.blur(); }
  if (mod && e.key.toLowerCase() === "k"){ e.preventDefault(); document.body.classList.add("browsing"); el.q.focus(); el.q.select(); }
  if (mod && e.key.toLowerCase() === "j"){ e.preventDefault(); newNote(); el.ed.focus(); }
  if (mod && e.key.toLowerCase() === "s"){ e.preventDefault(); if (current) showSheet(el.s1); }
  if (e.key === "Tab" && openSheet){
    const focusable = [...openSheet.querySelectorAll("button, [href], input, select, textarea")]
      .filter(x => !x.hidden && x.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

/* tab inserts a tab in the editor; mod+B/I/Shift+X apply formatting */
el.ed.addEventListener("keydown", e => {
  if (e.key === "Tab" && !e.shiftKey){
    e.preventDefault();
    const s = el.ed.selectionStart, t = el.ed.selectionEnd;
    el.ed.value = el.ed.value.slice(0,s) + "  " + el.ed.value.slice(t);
    el.ed.selectionStart = el.ed.selectionEnd = s + 2;
    el.ed.dispatchEvent(new Event("input"));
    return;
  }
  const mod = e.metaKey || e.ctrlKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === "b"){ e.preventDefault(); toggleWrap("**"); }
  else if (k === "i"){ e.preventDefault(); toggleWrap("*"); }
  else if (e.shiftKey && k === "x"){ e.preventDefault(); toggleWrap("~~"); }
});

window.addEventListener("beforeunload", () => { clearTimeout(saveTimer); persist(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) persist(); });

/* ============ boot ============ */
(async function(){
  try { const t = localStorage.getItem("ledger:theme"); if (t) document.documentElement.dataset.theme = t; } catch(e){}
  if (navigator.canShare && navigator.canShare({files:[new File([""], "t.html", {type:"text/html"})]}))
    $("#shareOpt").hidden = false;

  notes = await Store.load();
  if (!Array.isArray(notes)) notes = [];

  if (!notes.length){
    notes = [{
      id: uid(),
      created: Date.now(), updated: Date.now(),
      text: "# Read me first\n\nThis is Ledger. Notes live on this device — no account, no server.\n\n## Getting a note onto another device\n\nHit **Export** on any note and pick the web page option. You get one `.html` file that:\n\n- opens in any browser, on any device, with no app installed\n- keeps its formatting and works with no network\n- can be dropped back into Ledger to restore the note exactly\n\nSo the file you send someone is the same file you'd use as a backup.\n\n## Bringing things in\n\nDrag a file onto this window, or use the import button up top. Ledger reads:\n\n- `.html` it exported before\n- `.json` backups\n- any `.md` or `.txt` file\n\n## Writing\n\nMarkdown works: `#` headings, `**bold**`, `*italic*`, lists, `> quotes`, and fenced code blocks.\n\n- [x] Formatting shows up in exports\n- [ ] Delete this note whenever you like\n\n## Shortcuts\n\n```\nCtrl/Cmd + J    new note\nCtrl/Cmd + K    search\nCtrl/Cmd + S    export current note\n```\n"
    }];
    await persist();
  }

  try {
    const last = localStorage.getItem("ledger:current");
    if (last && notes.some(n => n.id === last)) current = last;
  } catch(e){}
  render();

  try {
    if (localStorage.getItem("ledger:driveConnected") === "1") trySilentDriveReconnect();
  } catch(e){}

  // "New note" home-screen shortcut
  if (new URLSearchParams(location.search).get("new")){
    newNote(); render();
    history.replaceState(null, "", location.pathname);
  }

  // Files opened with Ledger from the OS
  if ("launchQueue" in window && "files" in LaunchParams.prototype){
    window.launchQueue.setConsumer(async p => {
      if (!p.files || !p.files.length) return;
      const files = [];
      for (const h of p.files){ try { files.push(await h.getFile()); } catch(e){} }
      if (files.length) importFiles(files);
    });
  }

  if (location.protocol === "https:" || location.hostname === "localhost"){
    if ("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  }
})();
</script>
